site_name: Strategos Telos
site_description: Knowledge base and wiki
site_author: Tobias Malan
site_url: https://TobiasDraven.github.io/strategostelos-wiki

repo_name: TobiasDraven/strategostelos-wiki
repo_url: https://github.com/TobiasDraven/strategostelos-wiki

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.emoji
  - pymdownx.tasklist
  - admonition
  - toc:
      permalink: true

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - About: about.md
  - Categories: categories.md
  - Theory: theory/index.md
  - Wargaming:
      - Overview: wargaming/index.md
      - Introduction to Wargaming: wargaming/introduction-to-wargaming.md
      - History of Wargaming: wargaming/history-of-wargaming.md
      - Modelling, Simulation and Wargaming Overview: wargaming/modelling-simulation-and-wargaming-overview.md
      - Generations of Wargames: wargaming/generations-of-wargames.md
      - Types and Examples: wargaming/types-and-examples.md
      - The Wargaming Process: wargaming/the-wargaming-process.md
      - Applications Across the Spectrum of Conflict: wargaming/applications-across-the-spectrum-of-conflict.md
      - Future Trends: wargaming/future-trends.md
      - Tactical Decision Games:
          - Overview: wargaming/tdg/index.md
          - TDG-01 — Dry Riverbed Ambush: wargaming/tdg/tdg-01-dry-riverbed-ambush.md
          - TDG-02 — Checkpoint Alpha: wargaming/tdg/tdg-02-checkpoint-alpha.md
          - TDG-03 — Bridging Team Under Fire: wargaming/tdg/tdg-03-bridging-team-under-fire.md
          - TDG-04 — Medevac in the Contact Zone: wargaming/tdg/tdg-04-medevac-in-the-contact-zone.md
          - TDG-05 — Silent Net: wargaming/tdg/tdg-05-silent-net.md
  - Simulation:
      - Overview: simulation/index.md
  - Training:
      - Scenario Writing:
          - Overview: training/scenario-writing/index.md
          - Background and Context: training/scenario-writing/background.md
          - Narrative Design: training/scenario-writing/narrative.md
          - Design Process: training/scenario-writing/design-process.md
          - Inject Design: training/scenario-writing/injects.md
          - Checklist: training/scenario-writing/checklist.md
      - Exercise Design:
          - Overview: training/exercise-design/index.md
          - Exercise Types: training/exercise-design/exercise-types.md
          - Commissioning and Initiation: training/exercise-design/commissioning.md
          - Planning and Development: training/exercise-design/planning.md
          - Control and Documentation: training/exercise-design/control-and-docs.md
  - Domains:
      - Overview: domains/index.md
      - Landward: domains/landward.md
      - Maritime: domains/maritime.md
      - Aerospace: domains/aerospace.md
      - Outer Space: domains/outer-space.md
      - Cyber: domains/cyber.md
      - Noetic: domains/noetic.md
  - Force Structure:
      - Overview: force-structure/index.md
  - Articles: articles/placeholder.md
  - Reference: reference/placeholder.md

edit_uri: edit/main/docs/
